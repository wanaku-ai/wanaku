[package]
name = "wanaku-feature-evaluator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wanaku_feature_evaluator"

[lints]
workspace = true

[features]
# Exposes test-only seeding helpers (see `EvaluatorState::load_evaluators`)
# that bypass validation and revision recording. Never enable in production.
test-util = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
jsonschema = { version = "0.51", default-features = false }
praxis-filter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
wasmtime = { version = "47", features = ["component-model"] }
wasmtime-wasi = "47"
wanaku-apis = { workspace = true }
wanaku-filters = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serial_test = "4"
# Self-dependency to enable `test-util` when compiling this crate's own
# integration tests, so the seeding helpers are visible to tests only.
wanaku-feature-evaluator = { path = ".", features = ["test-util"] }
