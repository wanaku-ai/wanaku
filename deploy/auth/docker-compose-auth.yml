services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HOSTNAME_DEBUG: true
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: "xforwarded"
      # the public accessible hostname
      KC_HOSTNAME: http://localhost:8543
    ports:
      - "8543:8080"
      - "8943:9000"
    volumes:
      - ./wanaku-realm.json:/opt/keycloak/data/import/wanaku-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n" >&3;
          if cat <&3 | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
            exit 0
          else
            exit 1
          fi
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10

  oauth2-proxy-mcp:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    env_file:
      - oauth2-proxy-shared.env
      - oauth2-proxy-mcp.env
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    ports:
      - "4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy

  oauth2-proxy-mgmt:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    env_file:
      - oauth2-proxy-shared.env
      - oauth2-proxy-mgmt.env
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    ports:
      - "4181:4181"
    depends_on:
      keycloak:
        condition: service_healthy

  wanaku-server:
    build:
      context: ../..
      dockerfile: Containerfile
    image: quay.io/wanaku/wanaku-server:latest
    environment:
      WANAKU_AUTH_ISSUER: http://localhost:8543/realms/wanaku
      WANAKU_AUTH_UPSTREAM_ISSUER: http://keycloak:8080/realms/wanaku
      WANAKU_PERSIST_PATH: /data/registry
    volumes:
      - wanaku-data:/data
    depends_on:
      oauth2-proxy-mcp:
        condition: service_started
    # No ports exposed — only reachable via oauth2-proxy

volumes:
  wanaku-data:
  keycloak-data:
