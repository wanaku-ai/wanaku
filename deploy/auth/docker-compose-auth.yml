services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8543:8080"
    volumes:
      - ./wanaku-realm.json:/opt/keycloak/data/import/wanaku-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20

  oauth2-proxy-mcp:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    env_file:
      - oauth2-proxy-shared.env
      - oauth2-proxy-mcp.env
    ports:
      - "4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy

  oauth2-proxy-mgmt:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    env_file:
      - oauth2-proxy-shared.env
      - oauth2-proxy-mgmt.env
    ports:
      - "4181:4181"
    depends_on:
      keycloak:
        condition: service_healthy

  wanaku-praxis:
    build:
      context: ../..
      dockerfile: Containerfile
    environment:
      WANAKU_AUTH_ISSUER: http://keycloak:8080/realms/wanaku
    # No ports exposed — only reachable via oauth2-proxy
