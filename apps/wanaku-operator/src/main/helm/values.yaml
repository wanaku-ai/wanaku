---
app:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  oidc:
    secretName: wanaku-oidc
  metrics:
    grafanaDashboard:
      enabled: false
    serviceMonitor:
      enabled: false
      interval: 30s
