[package]
name = "wanaku-praxis-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wanaku_praxis"
path = "src/lib.rs"

[[bin]]
name = "wanaku-praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
pingora-core = { version = "0.8.2", package = "quixotic-plecostomus-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust-embed = "8"
utoipa = "5.5"
praxis-ai-filters = { workspace = true }
praxis-core = { workspace = true }
praxis-filter = { workspace = true }
praxis-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "fs"] }
tracing = { workspace = true }
wanaku-praxis-apis = { workspace = true }
wanaku-praxis-filters = { workspace = true }
wanaku-feature-chat = { workspace = true }
wanaku-feature-evaluator = { workspace = true }
wanaku-feature-intercept = { workspace = true }
wanaku-feature-mcp-metadata = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["process", "signal", "user"] }
tikv-jemallocator = "0.7.0"
