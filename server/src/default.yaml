listeners:
  - name: mcp
    address: "127.0.0.1:8081"
    filter_chains: [mcp_router]

filter_chains:
  - name: mcp_router
    filters:
      - filter: cors
        allow_origins: ["*"]
        allow_methods: ["GET", "POST", "OPTIONS"]
        allow_headers: ["Content-Type", "Accept", "Mcp-Session-Id", "Mcp-Protocol-Version"]
      - filter: mcp
        on_invalid: continue
      - filter: wanaku_mcp_init
      - filter: wanaku_tool_list
      - filter: wanaku_tool_call
      - filter: wanaku_resource_list
      - filter: wanaku_resource_read
      - filter: static_response
        status: 200
        headers:
          - name: content-type
            value: application/json
        body: '{"jsonrpc":"2.0","error":{"code":-32601,"message":"method not supported"},"id":null}'

insecure_options:
  skip_pipeline_validation: true
