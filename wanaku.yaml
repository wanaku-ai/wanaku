# Development sample. `cargo run` loads this file from the repository root.
# It registers test forwards on localhost and needs the example evaluator
# actions in actions/dist/ (built by features/evaluator/build.rs when
# cargo-component is installed). Without them, startup stops.
# For a complete annotated configuration, see examples/governed-mcp.
forwards:
  - name: "echo-mcp"
    address: "http://localhost:9090/mcp"
    namespace: "test-ns"
  - name: "test-mcp"
    address: "http://localhost:8181/mcp"
    namespace: "test-ns"

# Governance uses fail-safe defaults. Namespace entries override only the
# fields that they specify. See docs/governance-posture.md.
governance:
  default:
    mode: enforce
    no_match: deny
    on_failure: deny
    audit_level: basic

# Uncomment the namespace overrides below to enable these examples.
# Remove only the first "# " from each line. Keep the YAML indentation.
#   namespaces:
#     # Allow requests when a governance decision fails.
#     # Explicit denials still apply. Unmatched actions inherit no_match: deny.
#     # This setting does not permit an invalid evaluator runtime.
#     other-ns:
#       on_failure: allow
#
#     # Apply matching policies and evaluators. Deny requests on failure.
#     # Each filter permits unmatched actions. A denial from either filter
#     # still blocks the request. Note: the action-policy filter and the
#     # evaluator filter apply no_match independently. With no_match: deny,
#     # a request needs an allowing action-policy rule AND a matching
#     # evaluator. This file has no action_policy section, so with the
#     # overrides commented out, every tools/call is denied with -32003.
#     test-ns:
#       mode: enforce
#       on_failure: deny
#       no_match: allow
#
#     # Skip action-policy and evaluator evaluation in this namespace.
#     # Disabled mode requires a non-empty reason.
#     maintenance:
#       mode: disabled
#       disabled_reason: Scheduled maintenance window

# audit_level applies only when mode is audit. Basic audit skips external
# evaluator calls. Full audit runs them without applying processor mutations.
# Both audit levels let requests continue through these governance filters.

# Sample evaluator configuration. See docs/evaluator-engine.md for the full guide.
# LLM connections are config-only: they can't be set or read through the
# management API, only here.
llm_connections:
  - name: "local-llama"
    model: "llama3.2:latest"
    url: "http://localhost:11434/v1/"
    api_key: ""
  - name: "openrouter"
    model: "poolside/laguna-s-2.1:free"
    url: "https://openrouter.ai/api/v1"   # Wanaku appends only /chat/completions
    api_key: ""

# TypeSafe System One connections are also config-only. Set an API key here.
typesafe_system_one_connections:
  - name: "typesafe"
    model: "jev-latest"
    url: "https://api.typesafe.ai"
    api_key: ""

# OPA connections are config-only. Wanaku queries POST <url>/v1/data/<decision_path>.
# See examples/opa for a runnable policy.
opa_connections:
  - name: "local-policy"
    url: "http://127.0.0.1:8282"   # OPA defaults to :8181, which test-mcp uses above
    # token: ""                 # Optional bearer token for OPA --authentication=token
    # timeout_ms: 2000          # Default 2000, maximum 30000
    # ca_cert: "/etc/wanaku/opa-ca.pem"  # Optional PEM CA certificate for https URLs

# Only the first evaluator whose trigger matches runs. This evaluator has no
# trigger.namespace, so it matches every namespace and hides later entries.
evaluators:
  - name: "safety-gate"
    trigger:
      method: "tools/call"
    engine:
      type: llm
      operation: classify
      prompt: |
        You are a strict safety classifier. Classify this tool call as:
        - green: safe operations (read-only, low impact)
        - yellow: elevated operations (writes, config changes)
        - red: dangerous operations (database restarts, production deploys)

        Respond with ONLY a JSON object: {"level": "green|yellow|red", "reason": "brief explanation"}
      connection: "local-llama"
      result_schema:
        type: object
        properties:
          level:
            type: string
            enum: ["green", "yellow", "red"]
          reason:
            type: string
        required: ["level", "reason"]
    # Release archives ship this action in evaluators/ and the container image
    # in /data/evaluators/. In the source tree, build it via:
    #   cd actions/safety-review && cargo component build --release
    #   && cp target/wasm32-wasip1/release/*.wasm ../dist/
    processor:
      path: "actions/dist/safety_review_action.wasm"
