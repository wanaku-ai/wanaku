tools:
  - name: "echo-tool"
    type: "echo-tool"
    uri: "echo-tool://echo"
    description: "Echoes a message"
    input_schema:
      type: object
      properties:
        wanaku_body:
          type: string
          description: "The message to echo"
      required:
        - wanaku_body

services:
  - name: "echo-tool"
    address: "localhost:9191"
    service_type: "tool-invoker"


forwards:
  - name: "mock-mcp"
    address: "http://localhost:8180/mcp"
    namespace: "test-ns"

