name: UI E2E Tests

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE
  push:
    branches:
      - main
      - ci-*
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui-e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: '1.96'

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 'lts/*'
        cache: 'yarn'
        cache-dependency-path: ui/admin/yarn.lock

    - name: Build Admin UI
      working-directory: ui/admin
      run: |
        yarn install --frozen-lockfile
        yarn run build

    - name: Build evaluator actions
      uses: ./.github/actions/build-evaluator-actions

    - name: Build Server
      run: cargo build

    - name: Install Playwright dependencies
      working-directory: tests/e2e/ui
      run: |
        yarn install --frozen-lockfile
        npx playwright install --with-deps chromium

    - name: Start Server
      run: |
        cargo run &
        echo "Waiting for server to be ready..."
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/api/v1/management/statistics > /dev/null 2>&1; then
            echo "Server ready after ${i}s"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Server failed to start within 60s"
            exit 1
          fi
          sleep 1
        done

    - name: Run Playwright Tests
      working-directory: tests/e2e/ui
      run: npx playwright test

    - name: Upload Playwright Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: |
          tests/e2e/ui/playwright-report/
          tests/e2e/ui/test-results/
        retention-days: 14
        if-no-files-found: ignore
