name: Container

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t wanaku-praxis:ci -f Containerfile .

      - name: Run container
        run: docker run -d --name wanaku-praxis wanaku-praxis:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' wanaku-praxis 2>/dev/null || echo "starting")
            if [ "${status}" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker inspect --format='{{json .State.Health}}' wanaku-praxis
          docker logs wanaku-praxis
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f wanaku-praxis
