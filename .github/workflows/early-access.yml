name: Early Access

on:
  workflow_dispatch:
    inputs:
      currentDevelopmentVersion:
        description: Current development version (for example, 0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: early-access-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'quay.io' }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP || 'wanaku' }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            arch: aarch64
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      VERSION: ${{ inputs.currentDevelopmentVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ui/admin/yarn.lock

      - name: Validate version
        run: |
          versions=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | .[]')
          if [ "$versions" != "$VERSION" ]; then
            echo "Requested version $VERSION does not match workspace version(s): $versions" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "Version $VERSION cannot be used as a container tag" >&2
            exit 1
          fi

      - name: Build admin UI
        run: |
          corepack enable
          yarn --cwd ui/admin install --frozen-lockfile
          yarn --cwd ui/admin build

      - name: Test
        run: cargo test --workspace --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked -p wanaku-praxis-proxy

      - name: Package release binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="wanaku-praxis-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$archive"
          install -m 0755 target/release/wanaku-praxis "dist/$archive/wanaku-praxis"
          cp LICENSE README.md wanaku.yaml "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wanaku-praxis-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Login to container registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push container image
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/wanaku-praxis"
          docker build -f Containerfile \
            -t "$image:${VERSION}-${ARCH}" \
            -t "$image:early-access-${ARCH}" \
            .
          docker push "$image:${VERSION}-${ARCH}"
          docker push "$image:early-access-${ARCH}"

  create-manifests:
    name: Publish multi-architecture container manifests
    needs: build
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      VERSION: ${{ inputs.currentDevelopmentVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to container registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create and push manifests
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          ./build-manifests.sh "$VERSION" "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}"
          ./build-manifests.sh early-access "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}"

  publish:
    name: Publish rolling early-access release
    needs: [build, create-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.currentDevelopmentVersion }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # This is the GPG passphrase; the MAVEN_ prefix is retained for historical reasons.
      GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: wanaku-praxis-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums_sha256.txt

      - name: Sign release files
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in dist/*.tar.gz dist/checksums_sha256.txt; do
            gpg --batch --yes --armor --detach-sign \
              --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              "$file"
          done

      - name: Publish prerelease
        run: |
          gh release delete early-access --cleanup-tag --yes || true
          gh release create early-access dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Wanaku Praxis ${VERSION} early access" \
            --notes "Early-access build of Wanaku Praxis ${VERSION} from commit ${GITHUB_SHA}. This build is intended for testing and is not a stable release."
