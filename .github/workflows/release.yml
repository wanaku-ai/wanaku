name: release

# Stable, tagged releases handled by JReleaser.
#
# This workflow builds 5-platform archives (full + headless) and hands them
# to JReleaser. It also pushes the <version> container images (full + headless,
# linux x86_64 + aarch64 manifests) before the GitHub release is created.
# The early-access workflow uses the same release mechanism for its rolling
# prerelease.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.3.0)
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'quay.io' }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP || 'wanaku' }}

jobs:
  setup:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${version}"

  build:
    name: Build (${{ matrix.platform }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            container: true
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            container: true
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: windows-2025
            platform: windows-x86_64
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ui/admin/yarn.lock

      - name: Validate version
        shell: bash
        run: |
          server_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wanaku-server") | .version')
          if [ "$server_version" != "$VERSION" ]; then
            echo "Requested version $VERSION does not match wanaku-server version: $server_version" >&2
            exit 1
          fi

      - name: Build admin UI
        run: |
          corepack enable
          yarn --cwd ui/admin install --frozen-lockfile
          yarn --cwd ui/admin build

      - name: Build evaluator actions
        uses: ./.github/actions/build-evaluator-actions

      - name: Test
        run: cargo test --workspace --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked -p wanaku-server

      - name: Package release binary (Unix)
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="wanaku-server-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$archive"
          install -m 0755 target/release/wanaku-server "dist/$archive/wanaku-server"
          cp LICENSE README.md "dist/$archive/"
          mkdir -p "dist/$archive/evaluators"
          install -m 0644 actions/dist/*.wasm "dist/$archive/evaluators/"
          sed 's|actions/dist/|evaluators/|' wanaku.yaml > "dist/$archive/wanaku.yaml"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Package release binary (Windows)
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: |
          $archive = "wanaku-server-$env:VERSION-$env:PLATFORM"
          New-Item -ItemType Directory -Path "dist/$archive" -Force
          Copy-Item target/release/wanaku-server.exe "dist/$archive/wanaku-server.exe"
          Copy-Item LICENSE, README.md "dist/$archive/"
          New-Item -ItemType Directory -Path "dist/$archive/evaluators" -Force
          Copy-Item actions/dist/*.wasm "dist/$archive/evaluators/"
          (Get-Content wanaku.yaml) -replace 'actions/dist/', 'evaluators/' | Set-Content "dist/$archive/wanaku.yaml"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - name: Build headless release binary
        run: cargo build --release --locked -p wanaku-server --no-default-features

      - name: Package headless release binary (Unix)
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="wanaku-server-headless-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$archive"
          install -m 0755 target/release/wanaku-server "dist/$archive/wanaku-server"
          cp LICENSE README.md "dist/$archive/"
          mkdir -p "dist/$archive/evaluators"
          install -m 0644 actions/dist/*.wasm "dist/$archive/evaluators/"
          sed 's|actions/dist/|evaluators/|' wanaku.yaml > "dist/$archive/wanaku.yaml"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Package headless release binary (Windows)
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: |
          $archive = "wanaku-server-headless-$env:VERSION-$env:PLATFORM"
          New-Item -ItemType Directory -Path "dist/$archive" -Force
          Copy-Item target/release/wanaku-server.exe "dist/$archive/wanaku-server.exe"
          Copy-Item LICENSE, README.md "dist/$archive/"
          New-Item -ItemType Directory -Path "dist/$archive/evaluators" -Force
          Copy-Item actions/dist/*.wasm "dist/$archive/evaluators/"
          (Get-Content wanaku.yaml) -replace 'actions/dist/', 'evaluators/' | Set-Content "dist/$archive/wanaku.yaml"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - name: Package evaluator bundle
        # WASM components are platform-neutral, so one platform ships the bundle.
        if: matrix.platform == 'linux-x86_64'
        run: |
          bundle="wanaku-evaluators-${VERSION}"
          mkdir -p "dist/$bundle/evaluators" "dist/$bundle/wit" "dist/$bundle/sdk/js" "dist/$bundle/examples/js"
          install -m 0644 actions/dist/*.wasm "dist/$bundle/evaluators/"
          cp features/evaluator/wit/evaluator.wit "dist/$bundle/wit/"
          cp sdk/js/wanaku-actions.d.ts "dist/$bundle/sdk/js/"
          cp actions/js-examples/*.js "dist/$bundle/examples/js/"
          cp LICENSE "dist/$bundle/"
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          rm -rf "dist/$bundle"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wanaku-server-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      # A release always publishes its images, so missing registry credentials fail the build.
      - name: Login to container registry
        if: matrix.container
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push container image
        if: matrix.container
        run: cargo build-image --push --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/wanaku-server:${VERSION}"

      - name: Build and push headless container image
        if: matrix.container
        run: cargo build-image-headless --push --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/wanaku-server-headless:${VERSION}"

  create-manifests:
    name: Publish multi-architecture container manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Login to container registry
        run: |
          echo "$QUAY_PASSWORD" | podman login \
            --username "$QUAY_USERNAME" --password-stdin \
            "$CONTAINER_REGISTRY"

      - name: Create and push multi-arch manifest (full)
        run: cargo build-image-manifest --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/wanaku-server:${VERSION}"

      - name: Create and push multi-arch manifest (headless)
        run: cargo build-image-manifest --variant headless --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/wanaku-server-headless:${VERSION}"

  release:
    name: Release with JReleaser
    # The GitHub release waits for the images: consumers such as the evaluator template pin the image tag.
    needs: [setup, build, create-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      JRELEASER_PROJECT_VERSION: ${{ needs.setup.outputs.version }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # This is the GPG passphrase; the MAVEN_ prefix is retained for historical reasons.
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: wanaku-server-*
          merge-multiple: true

      - name: Run JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: 1.26.0
          arguments: full-release

      - name: Announce release in GitHub Discussions
        env:
          RELEASE_TAG: v${{ needs.setup.outputs.version }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          sed \
            -e "s|{{projectVersion}}|${RELEASE_VERSION}|g" \
            -e "s|{{releaseNotesUrl}}|${release_url}|g" \
            jreleaser/discussions.tpl > "$RUNNER_TEMP/discussion.md"
          gh discussion create \
            --category Announcements \
            --title "Wanaku ${RELEASE_VERSION} is available" \
            --body-file "$RUNNER_TEMP/discussion.md"

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          if-no-files-found: warn
