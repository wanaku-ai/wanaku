name: Dispatch Integration Tests

on:
  issue_comment:
    types: [created]
  # pull_request_target gives access to secrets for fork PRs. The PR code is never checked out
  # or run here: this workflow only dispatches to wanaku-tests.
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Comments that do not request the tests get a unique group, so they cannot cancel a pending run.
  group: >-
    ${{ (github.event_name == 'pull_request_target' || contains(github.event.comment.body, '/wanaku-integration-tests'))
      && format('integration-tests-pr-{0}', github.event.issue.number || github.event.pull_request.number)
      || format('integration-tests-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch Integration Tests
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'wanaku-ai/wanaku'
      && (
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '/wanaku-integration-tests'))
        || (github.event_name == 'pull_request_target'
          && !github.event.pull_request.draft)
      )
    # Automatic runs (any PR author, including forks) wait for a maintainer to approve the
    # "integration-tests" environment. Comment-triggered runs are gated by the permission check.
    environment: ${{ github.event_name == 'pull_request_target' && 'integration-tests' || '' }}
    steps:
      - name: Check commenter permission
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          if [[ "$PERM" != "admin" && "$PERM" != "write" ]]; then
            echo "::error::User ${ACTOR} does not have write permission (has: $PERM)"
            exit 1
          fi

      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='eyes'

      - name: Fetch PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          PR_JSON=$(gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json headRefName,headRepository)
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.headRepository.nameWithOwner')
          if [[ -z "$HEAD_REF" || -z "$HEAD_REPO" || "$HEAD_REPO" == "null" ]]; then
            echo "::error::Could not resolve PR head reference (fork may have been deleted)"
            exit 1
          fi
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_repo=${HEAD_REPO}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INTEGRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
          owner: wanaku-ai
          repositories: wanaku-tests

      - name: Dispatch integration tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          gh workflow run full-integration-test.yml \
            --repo wanaku-ai/wanaku-tests \
            --ref main \
            -f wanaku_repo="${HEAD_REPO}" \
            -f wanaku_branch="${HEAD_REF}" \
            -f pr_number="${PR_NUMBER}" \
            -f source_repo="${SOURCE_REPO}"
