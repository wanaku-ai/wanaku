name: Build Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci-*
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'quay.io' }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP || 'wanaku' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Create UI dist stub
        run: mkdir -p ui/admin/dist

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Set arch
        id: arch
        run: echo "arch=$(uname -m)" >> $GITHUB_OUTPUT

      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build container image
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          docker build -f Containerfile \
            -t ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-praxis:${{ github.ref_name }}-${{ steps.arch.outputs.arch }} \
            .

      - name: Push container image
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          docker push ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-praxis:${{ github.ref_name }}-${{ steps.arch.outputs.arch }}

  createManifests:
    needs: build
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create and push multi-arch manifests
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          ./build-manifests.sh ${{ github.ref_name }} ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}
