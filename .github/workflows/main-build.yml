name: Build Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci-*
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'quay.io' }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP || 'wanaku' }}
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Create UI dist stub
        run: mkdir -p ui/admin/dist

      - name: Build
        run: cargo build --verbose

      - name: Build (headless)
        run: cargo build --verbose --no-default-features -p wanaku-server

      - name: Test
        run: cargo test --verbose

      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push container image
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          cargo build-image \
            --tag ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-server:${{ env.IMAGE_TAG }}

      - name: Build and push headless container image
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          cargo build-image-headless \
            --tag ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-server-headless:${{ env.IMAGE_TAG }}

  createManifests:
    needs: build
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          echo "$QUAY_PASSWORD" | podman login \
            --username "$QUAY_USERNAME" --password-stdin \
            ${{ env.CONTAINER_REGISTRY }}

      - name: Create and push multi-arch manifest (full)
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          cargo build-image-manifest \
            --tag ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-server:${{ env.IMAGE_TAG }}

      - name: Create and push multi-arch manifest (headless)
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          cargo build-image-manifest --variant headless \
            --tag ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/wanaku-server-headless:${{ env.IMAGE_TAG }}
