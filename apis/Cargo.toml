[package]
name = "wanaku-apis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "wanaku_apis"

[lints]
workspace = true

[features]
openapi = ["dep:utoipa", "wanaku-types/openapi"]

[dependencies]
dashmap = { workspace = true }
http = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.1.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { version = "5.5", optional = true }
wanaku-types = { workspace = true }
