[workspace]
resolver = "3"
members = [
    "apis",
    "features/evaluator",
    "features/intercept",
    "features/mcp-metadata",
    "features/metrics",
    "features/plugins",
    "filters",
    "server",
]
exclude = [
    "actions/assembly-filter",
    "actions/safety-block",
    "actions/safety-warn",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2.1"
http = "1.4.2"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1.44"

praxis-core = { version = "0.5.1", package = "praxis-proxy-core" }
praxis-filter = { version = "0.5.1", package = "praxis-proxy-filter" }
praxis-protocol = { version = "0.5.1", package = "praxis-proxy-protocol" }
praxis-proxy = { version = "0.5.1", package = "praxis-proxy" }

praxis-ai-apis = { version = "0.2.0", git = "https://github.com/praxis-proxy/ai", rev = "b2baf287d27ffce7cba9638014f96ef66bf009fc", default-features = false }
praxis-ai-filters = { version = "0.2.0", git = "https://github.com/praxis-proxy/ai", rev = "b2baf287d27ffce7cba9638014f96ef66bf009fc", default-features = false }

wanaku-apis = { version = "0.3.0", path = "apis" }
wanaku-filters = { version = "0.3.0", path = "filters" }
wanaku-feature-evaluator = { version = "0.3.0", path = "features/evaluator" }
wanaku-feature-intercept = { version = "0.3.0", path = "features/intercept" }
wanaku-feature-mcp-metadata = { version = "0.3.0", path = "features/mcp-metadata" }
wanaku-feature-metrics = { version = "0.3.0", path = "features/metrics" }
wanaku-feature-plugins = { version = "0.3.0", path = "features/plugins" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
# Safety: prevent panicking in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Correctness
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

# Clarity
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
macro_use_imports = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"

# Complexity
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

# Async
large_futures = "warn"
large_stack_frames = "warn"

# Disallowed methods (configured in clippy.toml)
disallowed_methods = "deny"
