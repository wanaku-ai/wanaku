[workspace]
resolver = "3"
members = [
    "apis",
    "features/chat",
    "features/evaluator",
    "features/intercept",
    "features/mcp-metadata",
    "features/plugins",
    "filters",
    "server",
]
exclude = [
    "actions/assembly-filter",
    "actions/safety-block",
    "actions/safety-warn",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2.1"
http = "1.4.2"
prost = "0.14"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt"] }
tonic = "0.13"
tracing = "0.1.44"

praxis-core = { version = "0.5.1", package = "praxis-proxy-core" }
praxis-filter = { version = "0.5.1", package = "praxis-proxy-filter" }
praxis-protocol = { version = "0.5.1", package = "praxis-proxy-protocol" }
praxis-proxy = { version = "0.5.1", package = "praxis-proxy" }

praxis-ai-apis = { git = "https://github.com/praxis-proxy/ai", rev = "b2baf287d27ffce7cba9638014f96ef66bf009fc", default-features = false }
praxis-ai-filters = { git = "https://github.com/praxis-proxy/ai", rev = "b2baf287d27ffce7cba9638014f96ef66bf009fc", default-features = false }

wanaku-praxis-apis = { version = "0.3.0", path = "apis" }
wanaku-praxis-filters = { version = "0.3.0", path = "filters" }
wanaku-feature-chat = { version = "0.3.0", path = "features/chat" }
wanaku-feature-evaluator = { version = "0.3.0", path = "features/evaluator" }
wanaku-feature-intercept = { version = "0.3.0", path = "features/intercept" }
wanaku-feature-mcp-metadata = { version = "0.3.0", path = "features/mcp-metadata" }
wanaku-feature-plugins = { version = "0.3.0", path = "features/plugins" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
